name: Publish Rules Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'rules/**'
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count rules
        id: count
        run: |
          TOTAL=0
          for f in rules/*.txt rules/*.conf rules/*.yaml rules/*.mrs rules/*.srs rules/*.json rules/*.dat; do
            if [ -f "$f" ]; then
              C=$(grep -cve '^\s*$' -e '^\s*#' -e '^\s*!' "$f" 2>/dev/null || echo 0)
              TOTAL=$((TOTAL + C))
            fi
          done
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Package rules
        run: |
          mkdir -p dist
          cp rules/* dist/ || true
          ls -lh dist/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rules-latest
          name: AdBlock Filters - Latest
          body: |
            🤖 自动更新规则

            **更新时间**: ${{ github.run_started_at }}
            **规则总数**: ${{ steps.count.outputs.total }}

            ## 订阅方式

            ### 原始链接
